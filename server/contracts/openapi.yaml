openapi: 3.1.0
info:
  title: Workgroup AI Hub API
  version: 1.0.0-draft
  description: 本文件是独立新项目的协议草案；实现时需要补齐安全细节与代码生成。
servers:
  - url: https://hub.example.local/api/v1
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    operatorCookie:
      type: apiKey
      in: cookie
      name: hub_admin_session
      description: Local-demo operator session; not a user bearer token.
  schemas:
    Room:
      type: object
      required: [id, name, kind, ownerUserId, notice, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        kind: {type: string, enum: [ordinary, workgroup]}
        ownerUserId: {type: string, format: uuid}
        notice: {type: string, maxLength: 2000}
        createdAt: {type: string, format: date-time}
        dissolvedAt:
          type: string
          format: date-time
          description: 解散时间；存活房间不返回该字段。
        myRole:
          type: string
          enum: [owner, admin, member]
          description: 调用者在本房间的角色；仅成员视角的读取/创建响应返回。
    RoomSummary:
      allOf:
        - $ref: '#/components/schemas/Room'
        - type: object
          required: [memberCount, botCount, lastMessageAt, lastMessagePreview, lastMessageSeq, pendingApprovalCount]
          properties:
            memberCount:
              type: integer
              minimum: 0
              description: 活跃真人成员数。
            botCount:
              type: integer
              minimum: 0
              description: 活跃 room_bots 数。
            lastMessageAt:
              type: [string, 'null']
              format: date-time
              description: 最后一条消息时间；无消息为 null。
            lastMessagePreview:
              type: string
              maxLength: 80
              description: 最后一条消息的单行预览；换行折叠为空格，截断到 80 字符，无消息为空字符串。
            lastMessageSeq:
              type: integer
              minimum: 0
              description: 最后一条消息的 roomSeq；无消息为 0。客户端未读水位按此字段计算。
            pendingApprovalCount:
              type: integer
              minimum: 0
              description: 仅统计 owner_user_id 为调用者且 state=PENDING_APPROVAL 的任务。
    RoomMember:
      type: object
      required: [userId, userHandle, displayName, role, joinedAt]
      properties:
        userId: {type: string, format: uuid}
        userHandle: {type: string}
        displayName: {type: string}
        role: {type: string, enum: [owner, admin, member]}
        joinedAt: {type: string, format: date-time}
        online: {type: boolean}
    RoomBot:
      type: object
      required: [ownerUserId, botId, displayName, presence, addedAt]
      properties:
        ownerUserId: {type: string, format: uuid}
        botId: {type: string, maxLength: 128}
        displayName: {type: string, maxLength: 80}
        presence: {type: string, enum: [online, offline]}
        state: {type: string}
        addedAt: {type: string, format: date-time}
    RoomBotAdded:
      type: object
      required: [ownerUserId, botId, displayName, addedAt]
      properties:
        ownerUserId: {type: string, format: uuid}
        botId: {type: string, maxLength: 128}
        displayName: {type: string, maxLength: 80}
        addedAt: {type: string, format: date-time}
    RoomBotCandidate:
      type: object
      additionalProperties: false
      required: [ownerUserId, ownerDisplayName, botId, displayName, presence, state, visibility, mine, inRoom]
      properties:
        ownerUserId: {type: string, format: uuid}
        ownerDisplayName: {type: string}
        botId: {type: string, maxLength: 128}
        displayName: {type: string, maxLength: 80}
        presence: {type: string, enum: [online, offline]}
        state: {type: string}
        visibility: {type: string, enum: [private, room, public]}
        mine: {type: boolean}
        inRoom: {type: boolean}
      description: >-
        调用者自己的已发布 Bot（含 private）与其他活跃成员对调用者可见的 Bot。已在房间内的
        Bot 仍返回并标记 inRoom=true。仅这九个字段，不包含模型、Session、路径或工具等私有信息。
    BotInvitation:
      type: object
      additionalProperties: false
      required: [id, roomId, ownerUserId, botId, botDisplayName, invitedByUserId, status, expiresAt, createdAt]
      properties:
        id: {type: string, format: uuid}
        roomId: {type: string, format: uuid}
        roomName: {type: string}
        ownerUserId: {type: string, format: uuid}
        botId: {type: string, maxLength: 128}
        botDisplayName: {type: string}
        invitedByUserId: {type: string, format: uuid}
        status: {type: string, enum: [pending, accepted, declined, revoked, expired]}
        expiresAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    TaskEvent:
      type: object
      additionalProperties: false
      required: [id, taskId, eventType, actorUserId, payload, createdAt]
      properties:
        id: {type: string, format: uuid}
        taskId: {type: string, format: uuid}
        eventType: {type: string}
        actorUserId: {type: [string, 'null'], format: uuid}
        payload:
          type: object
          additionalProperties: true
          description: Hub 已脱敏的公开 payload；不含 scope、路径、工具参数或日志。
        createdAt: {type: string, format: date-time}
    Message:
      type: object
      required: [id, roomId, roomSeq, senderUserId, body, createdAt]
      properties:
        id: {type: string, format: uuid}
        roomId: {type: string, format: uuid}
        roomSeq: {type: integer, minimum: 1}
        senderUserId: {type: string, format: uuid}
        clientMessageId: {type: string, maxLength: 96}
        body: {type: string, maxLength: 50000}
        replyToMessageId: {type: string}
        mentions:
          type: array
          maxItems: 20
          description: >-
            被 @ 的成员或远程 Bot。按**稳定 ID** 指名（userId，可带 botId），不按显示名：
            显示名会随改名失效，且无法把正文里字面出现的“@Writer”与真实的召唤区分开。
            被 @ 的 Bot **只生成待审批任务候选**，对方本机不执行任何操作。
          items:
            type: object
            required: [userId]
            properties:
              userId: {type: string, format: uuid}
              botId: {type: string, maxLength: 64}
        attachments:
          type: array
          maxItems: 20
          description: >-
            随消息携带的附件，按 artifactId 指名。附件必须属于本房间，且**附带不等于发布**：
            能否下载仍由附件自身的 ACL 决定，非接收人一律不可读。
          items:
            type: object
            required: [artifactId]
            properties:
              artifactId: {type: string, format: uuid}
              fileName: {type: string, maxLength: 255}
        createdAt: {type: string, format: date-time}
    Task:
      type: object
      required: [id, roomId, requesterUserId, ownerUserId, state, description]
      properties:
        id: {type: string, format: uuid}
        roomId: {type: string, format: uuid}
        requesterUserId: {type: string, format: uuid}
        ownerUserId: {type: string, format: uuid}
        targetBotId: {type: string, nullable: true}
        description: {type: string, maxLength: 20000}
        state:
          type: string
          enum: [PENDING_APPROVAL, APPROVED, QUEUED, RUNNING, REVIEW_REQUIRED, COMPLETED, SHARED, REJECTED, CANCELLING, CANCELLED, EXPIRED, FAILED]
        version: {type: integer, minimum: 0}
        lastReason:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
          description: 最近一次失败/拒绝的分类码；只出现在房间任务列表，不含自由文本
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
paths:
  /health/live:
    get:
      security: []
      summary: Liveness
      responses:
        '200': {description: Running}
  /health/ready:
    get:
      summary: DB and readiness
      responses:
        '200': {description: Ready}
        '503': {description: Not ready}
  /auth/bootstrap:
    post:
      security: []
      summary: 创建匿名工作群 Hub 会话
      description: >-
        仅在 HUB_ANONYMOUS_BOOTSTRAP=true 时开放。Hub 生成 canonical guest user、device、access token
        和 refresh token；客户端提交的 userId、handle、role、permissions 等字段不会被信任。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [installationId, deviceLabel, platform]
              properties:
                installationId: {type: string, format: uuid}
                deviceLabel: {type: string, minLength: 1, maxLength: 120}
                platform: {type: string, minLength: 1, maxLength: 64}
                appVersion: {type: string, maxLength: 120}
      responses:
        '201':
          description: Guest identity and Host-only session credentials
          content:
            application/json:
              schema:
                type: object
                required: [user, device, accessToken, refreshToken, accessTokenExpiresAt, refreshTokenExpiresAt]
                properties:
                  user:
                    type: object
                    required: [id, userHandle, displayName, status]
                    properties:
                      id: {type: string, format: uuid}
                      userHandle: {type: string, pattern: '^guest-[a-z0-9-]+$'}
                      displayName: {type: string}
                      status: {type: string, enum: [active]}
                  device:
                    type: object
                    required: [id, label, platform, appVersion]
                    properties:
                      id: {type: string, format: uuid}
                      label: {type: string}
                      platform: {type: string}
                      appVersion: {type: string, nullable: true}
                  accessToken: {type: string}
                  refreshToken: {type: string}
                  accessTokenExpiresAt: {type: string, format: date-time}
                  refreshTokenExpiresAt: {type: string, format: date-time}
        '400': {description: Invalid bootstrap input}
        '403': {description: Anonymous bootstrap is disabled}
        '429': {description: Too many bootstrap attempts}
  /rooms:
    get:
      summary: 我的工作群列表（含侧栏 summary）
      description: >-
        只返回调用者仍是活跃成员的房间。每个列表项在房间字段之外带 memberCount、botCount、
        lastMessageAt、lastMessagePreview、lastMessageSeq 与 owner-scoped 的 pendingApprovalCount；
        服务端一次聚合查询计算，不逐房间查询。
      responses:
        '200':
          description: Rooms with sidebar summary
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms:
                    type: array
                    items: {$ref: '#/components/schemas/RoomSummary'}
    post:
      summary: 创建工作群或普通房间
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                kind: {type: string, enum: [ordinary, workgroup], default: ordinary}
                botIds:
                  type: array
                  description: >-
                    创建者自己的 Bot id。房间、owner 成员关系与这些 Bot 在同一事务中写入；
                    任一 Bot 未发布则整个创建被拒绝，不会留下半个工作群。
                  items: {type: string, minLength: 1, maxLength: 128}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [room, bots]
                properties:
                  room: {$ref: '#/components/schemas/Room'}
                  bots:
                    type: array
                    items: {$ref: '#/components/schemas/RoomBot'}
        '400': {description: Invalid name or kind}
        '404': {description: 指定的 Bot 不属于调用者或尚未发布}
  /rooms/{roomId}:
    parameters: [{name: roomId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: 读取房间、成员与已加入的 Bot
      responses:
        '200':
          description: Room detail for a member
          content:
            application/json:
              schema:
                type: object
                required: [room, members, bots]
                properties:
                  room: {$ref: '#/components/schemas/Room'}
                  members:
                    type: array
                    items: {$ref: '#/components/schemas/RoomMember'}
                  bots:
                    type: array
                    items: {$ref: '#/components/schemas/RoomBot'}
        '404': {description: 房间不存在，或调用者不是成员（两者不可区分）}
    patch:
      summary: 修改房间名称或公告（owner/admin）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                notice: {type: string, maxLength: 2000}
      responses:
        '200':
          description: Updated room
          content:
            application/json:
              schema:
                type: object
                required: [room]
                properties:
                  room: {$ref: '#/components/schemas/Room'}
        '403': {description: 调用者不是 owner/admin}
        '404': {description: 房间不存在，或调用者不是成员}
        '409': {description: 房间已解散}
  /rooms/{roomId}/bot-candidates:
    parameters: [{name: roomId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: 当前房间可拉入的 Bot 候选
      description: >-
        仅房间活跃成员可读，非成员返回与 requireMember 一致的 404。返回调用者自己已发布的 Bot
        （含 private，所有者恒可见）与其他活跃成员对调用者可见的 Bot；已在房间内的 Bot 仍返回并
        标记 inRoom=true。每项只有九个字段，不含模型、Session、路径或工具等私有信息。
      responses:
        '200':
          description: Visible Bot candidates
          content:
            application/json:
              schema:
                type: object
                required: [bots]
                properties:
                  bots:
                    type: array
                    items: {$ref: '#/components/schemas/RoomBotCandidate'}
        '404': {description: 房间不存在，或调用者不是成员（两者不可区分）}
  /rooms/{roomId}/bots:
    parameters: [{name: roomId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: 把调用者自己的 Bot 加入房间
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [botId]
              properties:
                botId: {type: string, maxLength: 128}
      responses:
        '201':
          description: Bot is an active room member
          content:
            application/json:
              schema:
                type: object
                required: [bot]
                properties:
                  bot: {$ref: '#/components/schemas/RoomBotAdded'}
        '404': {description: 房间不存在、调用者不是成员，或 Bot 未发布}
        '409': {description: 房间已解散}
  /rooms/{roomId}/bots/{ownerUserId}/{botId}:
    parameters:
      - {name: roomId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: ownerUserId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: botId, in: path, required: true, schema: {type: string, maxLength: 128}}
    delete:
      summary: 软移除房间 Bot 成员（所有者或 owner/admin）
      description: 关联的未完成任务会取消；Bot 历史仍保留。
      responses:
        '200':
          description: Bot removed
          content:
            application/json:
              schema:
                type: object
                required: [roomId, ownerUserId, botId, removedAt, cancelledTasks]
                properties:
                  roomId: {type: string, format: uuid}
                  ownerUserId: {type: string, format: uuid}
                  botId: {type: string, maxLength: 128}
                  removedAt: {type: string, format: date-time}
                  cancelledTasks:
                    type: array
                    items: {type: string, format: uuid}
        '403': {description: 调用者无权移除该 Bot}
        '404': {description: 房间不存在、调用者不是成员，或 Bot 不在房间}
        '409': {description: 房间已解散}
  /rooms/{roomId}/bot-invitations:
    parameters: [{name: roomId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: 邀请其他成员的 Bot 进入房间（owner/admin）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerUserId, botId]
              properties:
                ownerUserId: {type: string, format: uuid}
                botId: {type: string, maxLength: 128}
      responses:
        '201':
          description: Pending Bot invitation; a repeated request returns the existing pending invitation
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation: {$ref: '#/components/schemas/BotInvitation'}
        '403': {description: 调用者不是 owner/admin}
        '404': {description: 房间/Bot 不可见，或 Bot 所有者不是成员}
        '409': {description: 调用者邀请自己的 Bot（应直接加入）、Bot 已在房间，或房间已解散}
  /bot-invitations:
    get:
      summary: 当前用户收到的 pending Bot 邀请
      responses:
        '200':
          description: Pending Bot invitations for the caller
          content:
            application/json:
              schema:
                type: object
                required: [invitations]
                properties:
                  invitations:
                    type: array
                    items: {$ref: '#/components/schemas/BotInvitation'}
  /bot-invitations/{invitationId}/accept:
    parameters: [{name: invitationId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: Bot 所有者接受邀请并建立 room_bots
      responses:
        '200':
          description: Bot joined the room
          content:
            application/json:
              schema:
                type: object
                required: [roomId, ownerUserId, botId]
                properties:
                  roomId: {type: string, format: uuid}
                  ownerUserId: {type: string, format: uuid}
                  botId: {type: string, maxLength: 128}
        '404': {description: 邀请不存在、调用者不是 Bot 所有者，或房间/Bot 已不可用}
        '409': {description: 邀请非 pending，或房间已解散}
        '410': {description: 邀请已过期}
  /bot-invitations/{invitationId}/decline:
    parameters: [{name: invitationId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: Bot 所有者拒绝邀请
      responses:
        '200':
          description: Invitation declined
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation: {$ref: '#/components/schemas/BotInvitation'}
        '404': {description: 邀请不存在，或调用者不是 Bot 所有者}
        '409': {description: 邀请非 pending}
  /bot-invitations/{invitationId}/revoke:
    parameters: [{name: invitationId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: 邀请人或房间 owner/admin 撤销 Bot 邀请
      responses:
        '200':
          description: Invitation revoked
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation: {$ref: '#/components/schemas/BotInvitation'}
        '404': {description: 邀请不存在或调用者无权查看}
        '409': {description: 邀请非 pending}
  /rooms/{roomId}/task-events:
    parameters: [{name: roomId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: 房间任务活动流（脱敏）
      description: 成员可读；只返回 Hub 已脱敏的 publicTaskEvent，按时间倒序取页后按时间正序返回。
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 100}}
        - {name: before, in: query, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Redacted room task events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: {$ref: '#/components/schemas/TaskEvent'}
        '404': {description: 房间不存在，或调用者不是成员}
  /rooms/{roomId}/invitations:
    parameters: [{name: roomId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: 邀请用户到工作群（需要管理员权限）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUserId]
              properties:
                targetUserId: {type: string, format: uuid}
                role: {type: string, enum: [member, admin], default: member}
      responses:
        '201': {description: Invitation created}
  /invitations/{invitationId}/accept:
    parameters: [{name: invitationId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: 仅邀请收件人可接受
      responses:
        '200': {description: Member joined}
        '403': {description: Forbidden}
  /rooms/{roomId}/messages:
    parameters: [{name: roomId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: 获取工作群消息，用于断线补拉
      parameters:
        - name: afterSeq
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Ordered messages
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Message'}
    post:
      summary: 发送消息（成员且幂等）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientMessageId, body]
              properties:
                clientMessageId: {type: string, minLength: 8, maxLength: 96}
                body: {type: string, minLength: 1, maxLength: 50000}
      responses:
        '201':
          description: Message accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
  /rooms/{roomId}/dissolve:
    parameters: [{name: roomId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: 解散工作群（仅群主；保留历史与审计，不物理删除）
      description: >-
        工作群进入终态：拒绝新消息与新任务、撤回待处理邀请、取消未完成任务，并向房内在线成员
        广播 room.dissolved。房间本身与其消息、任务、成果、记忆**均保留**，因此解散后可继续只读。
        普通成员退出与管理员移除成员是另外两个操作，不会解散工作群。
      responses:
        '200':
          description: Dissolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  room: {$ref: '#/components/schemas/Room'}
                  cancelledTasks: {type: integer, minimum: 0}
        '403':
          description: 调用者不是群主
        '404':
          description: 房间不存在，或调用者不是成员（两者不可区分，避免探测）
        '409':
          description: 该工作群已被解散
  /rooms/{roomId}/tasks:
    parameters: [{name: roomId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: 创建待 B 本人审批的跨用户任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerUserId, description]
              properties:
                ownerUserId: {type: string, format: uuid}
                targetBotId: {type: string}
                description: {type: string, maxLength: 20000}
      responses:
        '201':
          description: Awaiting approval
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
  /tasks/{taskId}/decision:
    parameters: [{name: taskId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: 仅任务数据所有者本人可批准/拒绝
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, expectedVersion]
              properties:
                decision: {type: string, enum: [approve, reject]}
                expectedVersion: {type: integer, minimum: 0}
                assignmentMode: {type: string, enum: [existing_bot, chief_auto, create_bot]}
                assignedBotId: {type: string}
                approvedScope:
                  type: object
                  additionalProperties: true
                  description: 实现时必须定义严格 JSON Schema，不得直接信任客户端任意字段
      responses:
        '200':
          description: Decision committed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '403': {description: Approval forbidden}
        '409': {description: State/version conflict}
  /tasks/{taskId}/progress:
    parameters: [{name: taskId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: owner 本人回写脱敏进度
      description: 只有任务所有者可调用；公共事件只包含 state、stage 与 reason 分类码，不含路径、工具参数或日志。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                state: {type: string, enum: [QUEUED, RUNNING, REVIEW_REQUIRED, COMPLETED, FAILED, CANCELLED]}
                expectedVersion: {type: integer, minimum: 0}
                stage: {type: string}
                reason:
                  type: string
                  pattern: '^[A-Z][A-Z0-9_]{1,63}$'
                  description: 失败/拒绝的分类码；自由文本会被拒绝（INVALID_REASON）
      responses:
        '200':
          description: Progress recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {description: Invalid reason category}
        '403': {description: Not the task owner}
        '409': {description: State/version conflict}
  /tasks/approved:
    get:
      summary: 任务所有者的已批准待执行队列（owner-only）
      description: 只返回调用者本人拥有的 APPROVED 任务，并携带 owner 自己批准的 scope。用于 owner Host 在离线或未订阅房间时发现待执行工作；不是房间读接口。
      responses:
        '200':
          description: Owner's approved tasks
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items: {$ref: '#/components/schemas/Task'}
  /tasks/{taskId}/cancel:
    parameters: [{name: taskId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: 取消任务与吊销执行授权
      responses:
        '200': {description: Cancellation requested}

  # ---- local-demo operator admin ----
  /admin/login:
    post:
      security: []
      summary: 本地演示管理员登录
      description: 固定 admin 账号位于独立 operators 表；成功返回 HttpOnly cookie。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userHandle, password]
              properties:
                userHandle: {type: string}
                password: {type: string}
      responses:
        '200': {description: Operator session cookie}
        '401': {description: Invalid credentials}
        '429': {description: Too many attempts}
  /admin/logout:
    post:
      security: [{operatorCookie: []}]
      summary: 管理员登出
      responses:
        '200': {description: Session cleared}
  /admin/session:
    get:
      security: [{operatorCookie: []}]
      summary: 当前管理员会话
      responses:
        '200': {description: Operator}
        '401': {description: Not authenticated}
  /admin/users:
    get:
      security: [{operatorCookie: []}]
      summary: 只读用户列表，用于选择 owner/成员
      parameters:
        - {name: query, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Users without password hashes}
  /admin/workgroups:
    get:
      security: [{operatorCookie: []}]
      summary: 工作群列表（仅 kind=workgroup）
      parameters:
        - {name: query, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [live, dissolved, all]}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Workgroups}
    post:
      security: [{operatorCookie: []}]
      summary: 创建工作群
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, ownerUserId]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
                ownerUserId: {type: string, format: uuid}
      responses:
        '201': {description: Created workgroup}
        '400': {description: Invalid owner or name}
  /admin/workgroups/{workgroupId}:
    parameters: [{name: workgroupId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      security: [{operatorCookie: []}]
      summary: 工作群详情
      responses:
        '200': {description: Workgroup}
        '404': {description: No such workgroup}
    patch:
      security: [{operatorCookie: []}]
      summary: 修改工作群名称
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 120}
      responses:
        '200': {description: Renamed workgroup}
        '409': {description: Dissolved or invalid state}
    delete:
      security: [{operatorCookie: []}]
      summary: 解散工作群（软状态，不删除消息）
      responses:
        '200': {description: Dissolved workgroup}
        '409': {description: Already dissolved}
  /admin/workgroups/{workgroupId}/members:
    parameters: [{name: workgroupId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      security: [{operatorCookie: []}]
      summary: 直接添加 active 用户（角色 member）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: {type: string, format: uuid}
      responses:
        '201': {description: Member added}
        '409': {description: Already a member or workgroup dissolved}
  /admin/workgroups/{workgroupId}/members/{userId}:
    parameters:
      - {name: workgroupId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      security: [{operatorCookie: []}]
      summary: 移除工作群成员（软移除）
      responses:
        '200': {description: Member removed}
        '409': {description: Owner cannot be removed or workgroup dissolved}
  /admin/workgroups/{workgroupId}/messages:
    parameters: [{name: workgroupId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      security: [{operatorCookie: []}]
      summary: 只读工作群消息正文
      parameters:
        - {name: beforeSeq, in: query, schema: {type: integer, minimum: 1}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Message page; body is returned for operator reading}
        '404': {description: No such workgroup}
